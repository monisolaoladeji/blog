{% extends "base.html" %}

{% block content %}
<div class="page-head">
    <a href="{{ url_for('index') }}" class="breadcrumb">← Back to Feed</a>
    <h1>{% if post %}Edit Post{% else %}New Post{% endif %}</h1>
</div>

<div class="card">
    <form action="{% if post %}{{ url_for('update_post', post_id=post.id) }}{% else %}{{ url_for('create_post') }}{% endif %}" 
          method="POST" 
          enctype="multipart/form-data">
        
        <div class="field">
            <span>Title</span>
            <input type="text" name="title" value="{{ post.title if post else '' }}" required placeholder="Enter post title...">
        </div>

        <div class="field">
            <span>Content</span>
            <textarea name="content" rows="10" required placeholder="Write your post content here...">{{ post.content if post else '' }}</textarea>
        </div>

        <div class="field">
            <span>Featured Image</span>
            {% if post and post.image %}
                <div style="margin-bottom: 10px;">
                    <img src="{{ upload_url(post.image) }}" style="max-width: 200px; border-radius: 8px; display: block;">
                    <small class="muted">Current image: {{ post.image }}</small>
                </div>
            {% endif %}
            <input type="file" name="image" accept="image/*">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">
                {% if post %}Update Post{% else %}Publish Post{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
